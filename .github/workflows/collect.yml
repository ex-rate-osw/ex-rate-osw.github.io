name: 환율 수집 (일별)

on:
  schedule:
    # 수출입은행은 영업일 오전 11시 전후에 하루 1번 고시한다. (cron은 UTC 기준)
    # GitHub 예약 실행은 건너뛰어질 때가 있어 하루 여러 번 시도하고,
    # 스크립트가 이미 받은 날짜는 다시 받지 않는다. 빠진 날은 다음 실행에서 채워진다.
    - cron: '23 2,4,7,10 * * 1-5'   # 월~금 11:23, 13:23, 16:23, 19:23 KST
  workflow_dispatch:                # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: collect-rates
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 환율 수집
        run: python3 scripts/collect_daily.py
        env:
          KOREAEXIM_API_KEY: ${{ secrets.KOREAEXIM_API_KEY }}

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d') 환율 기록"
          git pull --rebase
          git push
