name: 환율 수집

on:
  schedule:
    # cron은 UTC 기준. 외환시장이 열려 있는 시간(한국시간 월 07시 ~ 토 08시)에 매시간 7분에 실행
    - cron: '7 22,23 * * 0'   # 일요일 UTC 22,23시 = 월요일 07,08시 KST
    - cron: '7 * * * 1-5'     # 월~금 UTC = 월 09시 ~ 토 08시 KST
  workflow_dispatch:          # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: collect-rates
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 환율 수집
        run: python3 scripts/collect.py
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rates.csv
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 환율 기록"
          git pull --rebase
          git push
